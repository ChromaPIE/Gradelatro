[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''won = false,'''
position = "after"
payload = '''grdl_run_started_at = os.time(),'''
match_indent = true
overwrite = false

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''G.FUNCS.overlay_menu{'''
position = "before"
payload = '''
            if Gradelatro and Gradelatro.RunEnd then
                pcall(function()
                    Gradelatro.RunEnd.capture_win_buyout_offer()
                    if Gradelatro.BuyoutUI then
                        Gradelatro.BuyoutUI.install_runtime(Gradelatro, G)
                    end
                end)
            end
'''
match_indent = false
overwrite = false

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''        not show_win_cta and UIBox_button({id = 'from_game_won', button = 'notify_then_setup_run', label = {localize('b_start_new_run')}, minw = 2.5, maxw = 2.5, minh = 1, focus_args = {nav = 'wide', snap_to = true}}) or nil,'''
position = "before"
payload = '''
        not show_win_cta and Gradelatro and Gradelatro.BuyoutUI and Gradelatro.BuyoutUI.has_offer(Gradelatro.pending_buyout_offer) and UIBox_button({id = 'grdl_buyout_button', button = 'grdl_open_buyout', label = {localize('grdl_b_buyout')}, minw = 2.5, maxw = 2.5, minh = 1, colour = G.C.BLUE, focus_args = {nav = 'wide', snap_to = true}}) or nil,
        not show_win_cta and Gradelatro and Gradelatro.BuyoutUI and Gradelatro.BuyoutUI.has_offer(Gradelatro.pending_buyout_offer) and {n=G.UIT.R, config={align = "cm", minh = 0.1, minw = 0.1}, nodes={}} or nil,
'''
match_indent = false
overwrite = false

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''local your_collection = nil'''
position = "after"
payload = '''
local grdl_binder = nil
if Gradelatro and Gradelatro.BinderUI then
    pcall(function() Gradelatro.BinderUI.install_runtime(Gradelatro, G) end)
    grdl_binder = UIBox_button{ label = {localize('grdl_b_binder')}, button = "grdl_open_binder", minw = 5, id = 'grdl_binder'}
end
'''
match_indent = true
overwrite = false

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''      your_collection,'''
position = "after"
payload = '''      grdl_binder,'''
match_indent = false
overwrite = false

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''  function overlay_infotip(text_rows)'''
position = "before"
payload = '''
  local grdl_info_tip_from_rows = info_tip_from_rows
  function info_tip_from_rows(desc_nodes, name)
    local box = grdl_info_tip_from_rows(desc_nodes, name)
    if desc_nodes and desc_nodes.grdl_hide_title and box and box.nodes then
      table.remove(box.nodes, 1)
    end
    return box
  end

'''
match_indent = false
overwrite = false

[[patches]]
[patches.pattern]
target = "main.lua"
pattern = '''				if name == 'touchpressed' then'''
position = "after"
payload = '''
					if Gradelatro and Gradelatro.TouchInput then
						pcall(Gradelatro.TouchInput.touchpressed, Gradelatro, a, b, c, d)
					end
'''
match_indent = false
overwrite = false
